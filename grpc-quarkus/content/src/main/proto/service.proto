syntax = "proto3";

option java_multiple_files = true;
option java_package = "${{ values.javaPackage }}";

package ${{ values.name }};

service ${{ values.grpcServiceName }} {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
